<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HERWA LOCATE</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
html,body{height:100%;margin:0;padding:0}
#map{height:100%;width:100%}

#searchBox{
position:fixed;top:15px;left:15px;right:15px;
z-index:1000;display:flex;gap:8px
}

#searchInput{
flex:1;padding:13px 15px;border:none;border-radius:25px;
font-size:16px;box-shadow:0 2px 8px rgba(0,0,0,.25)
}

#searchBtn,#locateBtn{
border:none;border-radius:25px;background:white;
font-size:16px;font-weight:bold;
box-shadow:0 2px 8px rgba(0,0,0,.3)
}

#searchBtn{padding:0 16px}

#locateBtn{
position:fixed;bottom:20px;right:20px;
z-index:1000;padding:13px 18px
}
</style>
</head>

<body>

<div id="searchBox">
<input id="searchInput" type="text" placeholder="🔎 Search Maiduguri...">
<button id="searchBtn">Search</button>
</div>

<div id="map"></div>

<button id="locateBtn">📍 My Location</button>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const maiduguri=[11.8333,13.1500];

const map=L.map("map").setView(maiduguri,13);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
maxZoom:19,
attribution:"&copy; OpenStreetMap contributors"
}).addTo(map);

L.marker(maiduguri)
.addTo(map)
.bindPopup("<b>HERWA LOCATE</b><br>Maiduguri");

let userMarker=null;
let accuracyCircle=null;
let searchMarker=null;


/* MY LOCATION */

document.getElementById("locateBtn").onclick=function(){

if(!navigator.geolocation){
alert("Your device does not support GPS.");
return;
}

this.textContent="📍 Finding...";

navigator.geolocation.getCurrentPosition(
async function(position){

const lat=position.coords.latitude;
const lon=position.coords.longitude;
const accuracy=position.coords.accuracy;

const location=[lat,lon];

if(userMarker) map.removeLayer(userMarker);
if(accuracyCircle) map.removeLayer(accuracyCircle);

userMarker=L.marker(location).addTo(map);

accuracyCircle=L.circle(location,{
radius:accuracy
}).addTo(map);

map.setView(location,16);

userMarker.bindPopup(
"<b>📍 You are here</b><br>Finding location..."
).openPopup();

try{

const response=await fetch(
"https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat="+
lat+"&lon="+lon+"&zoom=18&addressdetails=1"
);

const data=await response.json();

const name=data.display_name||
"Location name unavailable";

userMarker.bindPopup(
"<b>📍 You are here</b><br><br>"+name
).openPopup();

}catch(error){

userMarker.bindPopup(
"<b>📍 You are here</b><br><br>Location name unavailable."
).openPopup();

}

document.getElementById("locateBtn").textContent=
"📍 My Location";

},

function(){

alert(
"Unable to find your location. Please check GPS permission."
);

document.getElementById("locateBtn").textContent=
"📍 My Location";

},

{
enableHighAccuracy:true,
timeout:15000,
maximumAge:0
});

};


/* SEARCH */

async function searchPlace(){

const input=document.getElementById("searchInput")
.value.trim();

if(!input){
alert("Please enter a place to search.");
return;
}

const query=input+", Maiduguri, Nigeria";

try{

const response=await fetch(
"https://nominatim.openstreetmap.org/search?format=jsonv2&q="+
encodeURIComponent(query)+
"&limit=5&addressdetails=1"
);

const results=await response.json();

if(results.length===0){

alert("Place not found.");
return;

}

const place=results[0];

const lat=parseFloat(place.lat);
const lon=parseFloat(place.lon);

if(searchMarker) map.removeLayer(searchMarker);

searchMarker=L.marker([lat,lon])
.addTo(map)
.bindPopup(
"<b>📍 "+place.display_name+"</b>"
)
.openPopup();

map.setView([lat,lon],16);

}catch(error){

alert(
"Search failed. Please check your internet connection."
);

}

}

document.getElementById("searchBtn")
.addEventListener("click",searchPlace);

document.getElementById("searchInput")
.addEventListener("keydown",function(event){

if(event.key==="Enter"){
searchPlace();
}

});

</script>

</body>
</html>
