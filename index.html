<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HERWA LOCATE</title>

    <!-- Leaflet -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <style>
        html,
        body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        #map {
            height: 100%;
            width: 100%;
        }

        #locateBtn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;

            padding: 13px 18px;
            border: none;
            border-radius: 25px;

            background: white;
            color: #222;

            font-size: 16px;
            font-weight: bold;

            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
    </style>
</head>

<body>

    <div id="map"></div>

    <button id="locateBtn">📍 My Location</button>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>

        // ==========================
        // HERWA LOCATE
        // ==========================

        const maiduguri = [11.8333, 13.1500];

        const map = L.map("map").setView(
            maiduguri,
            13
        );

        L.tileLayer(
            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
            {
                maxZoom: 19,
                attribution:
                    "&copy; OpenStreetMap contributors"
            }
        ).addTo(map);

        L.marker(maiduguri)
            .addTo(map)
            .bindPopup(
                "<b>HERWA LOCATE</b><br>Maiduguri"
            );


        // ==========================
        // USER LOCATION
        // ==========================

        let userMarker = null;
        let accuracyCircle = null;

        document
            .getElementById("locateBtn")
            .addEventListener("click", function () {

                if (!navigator.geolocation) {

                    alert(
                        "Your device does not support GPS location."
                    );

                    return;
                }

                this.textContent =
                    "📍 Finding you...";


                navigator.geolocation.getCurrentPosition(

                    async function(position) {

                        const latitude =
                            position.coords.latitude;

                        const longitude =
                            position.coords.longitude;

                        const accuracy =
                            position.coords.accuracy;

                        const userLocation = [
                            latitude,
                            longitude
                        ];


                        // Remove old marker
                        if (userMarker) {

                            map.removeLayer(
                                userMarker
                            );
                        }


                        // Remove old circle
                        if (accuracyCircle) {

                            map.removeLayer(
                                accuracyCircle
                            );
                        }


                        // Create marker
                        userMarker =
                            L.marker(
                                userLocation
                            ).addTo(map);


                        // Accuracy circle
                        accuracyCircle =
                            L.circle(
                                userLocation,
                                {
                                    radius: accuracy
                                }
                            ).addTo(map);


                        // Move map
                        map.setView(
                            userLocation,
                            16
                        );


                        // ==========================
                        // FIND LOCATION NAME
                        // ==========================

                        userMarker
                            .bindPopup(
                                "<b>📍 You are here</b><br>" +
                                "Finding location name..."
                            )
                            .openPopup();


                        try {

                            const response =
                                await fetch(
                                    "https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=" +
                                    latitude +
                                    "&lon=" +
                                    longitude +
                                    "&zoom=18&addressdetails=1"
                                );


                            const data =
                                await response.json();


                            let locationName =
                                data.display_name ||
                                "Location name unavailable";


                            userMarker
                                .bindPopup(
                                    "<b>📍 You are here</b><br><br>" +
                                    locationName
                                )
                                .openPopup();


                        } catch (error) {

                            userMarker
                                .bindPopup(
                                    "<b>📍 You are here</b><br><br>" +
                                    "Location name could not be found."
                                )
                                .openPopup();

                        }


                        document.getElementById(
                            "locateBtn"
                        ).textContent =
                            "📍 My Location";

                    },


                    function(error) {

                        let message =
                            "Unable to find your location.";

                        if (error.code === 1) {

                            message =
                                "Location permission was denied. Please allow location access.";

                        }

                        if (error.code === 2) {

                            message =
                                "Location could not be determined. Turn on GPS and try again.";

                        }

                        if (error.code === 3) {

                            message =
                                "Location request timed out. Try again.";

                        }


                        alert(message);


                        document.getElementById(
                            "locateBtn"
                        ).textContent =
                            "📍 My Location";

                    },


                    {
                        enableHighAccuracy: true,
                        timeout: 15000,
                        maximumAge: 0
                    }

                );

            });

    </script>

</body>
</html>
